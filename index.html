<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Bits</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div><small>PERSONAL ENGLISH NOTE</small><h1>My English Bits</h1><p>내가 실제로 말한 문장을, 진짜 쓰는 영어로.</p></div><button id="themeBtn" class="round">◐</button></header>
<main>
<section id="todayView" class="view active"><div class="hero"><div><span>TODAY</span><h2 id="todayLabel"></h2><p>오늘 대화에서 나온 표현을 저장해보세요.</p></div><b id="todayCount">0</b></div><h3>오늘 표현 가져오기</h3><div class="panel"><textarea id="jsonInput" rows="8" placeholder='[{"original":"I everyday jog.","natural":"I go jogging every day.","alternative":"","meaning":"나는 매일 조깅해.","context":"daily routine","tag":"running"}]'></textarea><div class="row"><button id="importBtn" class="primary">오늘 날짜로 추가</button><button id="sampleBtn">샘플 넣기</button></div><p id="msg" class="muted"></p></div><details class="panel"><summary>직접 한 문장 추가하기</summary><form id="manualForm"><input id="o" placeholder="내가 말한 문장"><input id="n" required placeholder="자연스러운 영어"><input id="a" placeholder="대안 표현"><input id="m" required placeholder="한국어 뜻"><input id="c" placeholder="상황"><input id="t" placeholder="태그"><button class="primary">오늘 날짜로 저장</button></form></details><h3>오늘 저장한 표현</h3><div id="todayCards" class="cards"></div></section>
<section id="libraryView" class="view"><div class="head"><h2>My Expressions</h2><span id="libraryCount" class="pill">0</span></div><div class="search"><input id="searchInput" placeholder="표현, 뜻, 태그 검색"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="favorite">★</button></div><div id="libraryList" class="groups"></div></section>
<section id="practiceView" class="view"><div class="head"><h2>Practice</h2><span id="counter" class="pill">0 / 0</span></div><label class="label">연습 범위</label><select id="practiceDate"><option value="all">All expressions</option></select><div class="practice"><span id="pTag" class="tag">DAILY</span><p class="muted">영어로 어떻게 말할까?</p><h3 id="pMeaning">표현을 저장하면 연습을 시작할 수 있어요.</h3><div id="answer" class="answer hidden"><div class="answerTop"><b id="pNatural"></b><button id="speakPractice" class="speak">🔊</button></div><p id="pAlt" class="muted"></p><div class="original"><small>YOUR ORIGINAL</small><p id="pOriginal"></p></div></div><div class="spacer"></div><button id="showBtn" class="primary full">정답 보기</button><div id="nextRow" class="row hidden"><button id="againBtn">Again</button><button id="nextBtn" class="primary">Next</button></div></div></section>
</main><nav><button class="nav active" data-view="todayView">＋<small>Today</small></button><button class="nav" data-view="libraryView">▤<small>Library</small></button><button class="nav" data-view="practiceView">◎<small>Practice</small></button></nav></div>
<template id="cardTpl"><article class="card"><div class="cardtop"><span class="tag cardTag"></span><div><button class="speak cardSpeak">🔊</button><button class="fav">☆</button></div></div><h4 class="cardNatural"></h4><p class="cardMeaning muted"></p><hr><small>YOU SAID</small><p class="cardOriginal"></p><small>ALSO</small><p class="cardAlt"></p><div class="foot"><span class="cardContext muted"></span><button class="delete">삭제</button></div></article></template>
<script src="app.js"></script></body></html>
